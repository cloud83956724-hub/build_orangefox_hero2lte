name: Build OrangeFox hero2lte (AI-everywhere v7)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      WORKDIR: ${{ github.workspace }}/foxbuild
      FOX_BRANCH: "11.0"
      JOBS: "4"
      CCACHE_MAX: "20G"
      ZIP_NAME: "OrangeFox-hero2lte-TWRP.zip"
      DEVICE_TREE_URL: "https://github.com/OrangeFoxRecovery/device_samsung_hero2lte.git"
      DEVICE_TREE_BRANCH_PRIMARY: "fox_11.0"
      DEVICE_TREE_BRANCH_ALT1: "fox_9.0"
      DEVICE_TREE_BRANCH_ALT2: "main"
      AI_ENDPOINT: "https://models.inference.ai.azure.com/chat/completions"
      MAX_SECONDS: "19800"
      DEP_HERO_COMMON_URL: ""
      DEP_HERO_COMMON_BRANCH: "fox_11.0"
      DEP_UNIVERSAL8890_URL: ""
      DEP_UNIVERSAL8890_BRANCH: "fox_11.0"
      DEP_HW_SAMSUNG_URL: ""
      DEP_HW_SAMSUNG_BRANCH: "fox_11.0"

    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hero2lte-${{ github.sha }}
          restore-keys: |
            ccache-hero2lte-

      - name: Setup swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Bootstrap Dockerfile + build script (persist in WORKDIR)
        run: |
          set -e
          mkdir -p "$WORKDIR/artifacts" "$WORKDIR/ai"

          cat > "$WORKDIR/Dockerfile" <<'DOCKEREOF'
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive LC_ALL=C
          SHELL ["/bin/bash", "-o", "pipefail", "-c"]
          RUN dpkg --add-architecture i386
          RUN apt-get update -y
          RUN apt-get install -y --no-install-recommends \
                ca-certificates git curl wget zip unzip tar \
                build-essential make flex bison gperf \
                python3 python-is-python3 \
                ccache rsync procps file xxd \
                libssl-dev openjdk-11-jdk-headless \
                zlib1g-dev gcc-multilib g++-multilib \
                libncurses-dev lib32ncurses-dev lib32z1-dev lib32readline-dev \
                lzop libxml2-utils xsltproc fontconfig \
                libgl1-mesa-dev libx11-dev
          RUN for t in git curl gcc g++ make ccache python3 zip unzip java file; do \
                command -v $t >/dev/null || { echo "MISSING $t"; exit 1; }; \
              done
          WORKDIR /workspace
          DOCKEREOF

          cat > "$WORKDIR/of_build.sh" <<'BUILDEOF'
          #!/bin/bash
          set +e
          export LC_ALL=C
          DEVICE="hero2lte"
          FOX_PATH="$WORKDIR/$FOX_BRANCH"
          ART_DIR="$WORKDIR/artifacts"
          LOG="$WORKDIR/build.log"
          SENTINEL="$WORKDIR/.build_done"
          AI_FIX="$WORKDIR/ai/ai_fix.sh"
          FAILED=()
          mkdir -p "$WORKDIR" "$ART_DIR" "/root/.ccache"
          : > "$LOG"
          log() { printf '[%s] %s\n' "$(date '+%H:%M:%S')" "$*" | tee -a "$LOG" >&2; }

          if [ -f "$AI_FIX" ]; then
              log ">>> Sourcing AI fix from previous attempt:"
              tee -a "$LOG" < "$AI_FIX" >&2
              # shellcheck disable=SC1090
              source "$AI_FIX" 2>&1 | tee -a "$LOG" >&2
              log ">>> AI fix sourced (rc=$?)"
          fi

          retry_step() {
              local name="$1"; shift
              log "════════ STEP: $name ════════"
              "$@" 2>&1 | stdbuf -oL -eL tee -a "$LOG" >&2
              local rc=${PIPESTATUS[0]}
              if [ "$rc" -eq 0 ]; then log "[OK] $name"; return 0; fi
              log "[RETRY] $name rc=$rc"; sleep 3
              "$@" 2>&1 | stdbuf -oL -eL tee -a "$LOG" >&2
              rc=${PIPESTATUS[0]}
              if [ "$rc" -eq 0 ]; then log "[OK] $name (retry)"; return 0; fi
              log "[FAIL] $name rc=$rc -> CONTINUE"
              FAILED+=("$name"); return 0
          }

          s00_env() {
              uname -a; head -2 /etc/os-release; nproc; free -h; df -h /
              for t in git curl gcc make ccache python3 zip unzip java; do
                  command -v $t || echo "MISSING $t"
              done
          }

          s01_ccache() {
              export CCACHE_DIR="/root/.ccache"
              ccache -M "$CCACHE_MAX"; ccache -z; ccache -s
          }

          s02_repo_tool() {
              mkdir -p /root/.bin
              curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /root/.bin/repo
              chmod +x /root/.bin/repo
              export PATH="/root/.bin:$PATH"
              repo --version
          }

          # Sync: thử repo init trực tiếp, fallback orangefox_sync.sh
          s03_sync_fox() {
              export PATH="/root/.bin:$PATH"
              cd "$WORKDIR" || return 1
              if [ ! -d "$FOX_PATH/.repo" ]; then
                  mkdir -p "$FOX_PATH"
                  cd "$FOX_PATH" || return 1
                  echo ">>> repo init direct..."
                  set -x
                  repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_11.0 2>&1
                  local rc=$?
                  set +x
                  if [ $rc -eq 0 ]; then
                      repo sync -j"$JOBS" --force-sync --no-clone-bundle --no-tags 2>&1
                      return $?
                  fi
                  echo ">>> fallback orangefox_sync.sh"
                  cd "$WORKDIR" || return 1
                  rm -rf "$FOX_PATH" "$WORKDIR/sync"
                  git clone https://gitlab.com/OrangeFox/sync.git -b fox_11.0 --depth=1 "$WORKDIR/sync" || return 1
                  ( cd "$WORKDIR/sync" && ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_PATH" )
                  return $?
              fi
              cd "$FOX_PATH" || return 1
              repo sync -j"$JOBS" --force-sync --no-clone-bundle --no-tags 2>&1
              return $?
          }

          # Clone device tree: thử PRIMARY -> ALT1 -> ALT2
          s04_clone_dt() {
              mkdir -p "$FOX_PATH/device/samsung"
              rm -rf "$FOX_PATH/device/samsung/$DEVICE"
              local branches=("$DEVICE_TREE_BRANCH_PRIMARY" "$DEVICE_TREE_BRANCH_ALT1" "$DEVICE_TREE_BRANCH_ALT2")
              local b
              for b in "${branches[@]}"; do
                  echo ">>> try device tree branch: $b"
                  if git clone --depth=1 -b "$b" "$DEVICE_TREE_URL" \
                        "$FOX_PATH/device/samsung/$DEVICE" 2>&1 | tee -a "$LOG"; then
                      echo ">>> SUCCESS device tree branch=$b"
                      echo "DEVICE_TREE_BRANCH_USED=$b" > "$WORKDIR/ai/dt_branch.txt"
                      return 0
                  fi
                  rm -rf "$FOX_PATH/device/samsung/$DEVICE"
              done
              return 1
          }

          s05_clone_deps() {
              cd "$FOX_PATH" || return 1
              local fail=0
              if [ -n "$DEP_HERO_COMMON_URL" ] && [ ! -d device/samsung/hero-common ]; then
                  git clone --depth=1 -b "$DEP_HERO_COMMON_BRANCH" \
                      "$DEP_HERO_COMMON_URL" device/samsung/hero-common || fail=1
              fi
              if [ -n "$DEP_UNIVERSAL8890_URL" ] && [ ! -d kernel/samsung/universal8890 ]; then
                  mkdir -p kernel/samsung
                  git clone --depth=1 -b "$DEP_UNIVERSAL8890_BRANCH" \
                      "$DEP_UNIVERSAL8890_URL" kernel/samsung/universal8890 || fail=1
              fi
              if [ -n "$DEP_HW_SAMSUNG_URL" ] && [ ! -d hardware/samsung ]; then
                  mkdir -p hardware
                  git clone --depth=1 -b "$DEP_HW_SAMSUNG_BRANCH" \
                      "$DEP_HW_SAMSUNG_URL" hardware/samsung || fail=1
              fi
              return $fail
          }

          s06_build() {
              cd "$FOX_PATH" || return 1
              [ -f build/envsetup.sh ] || { echo "!!! No build/envsetup.sh"; return 1; }
              export ALLOW_MISSING_DEPENDENCIES=true USE_CCACHE=1
              export CCACHE_DIR="/root/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE="$CCACHE_MAX"
              source build/envsetup.sh || return 1
              lunch omni_${DEVICE}-eng || lunch fox_${DEVICE}-eng || return 1
              mka recoveryimage -j"$JOBS"
          }

          s07_collect() {
              local out="$FOX_PATH/out/target/product/$DEVICE"
              [ -d "$out" ] || { echo "out missing: $out"; return 1; }
              find "$out" -maxdepth 1 -type f \
                  \( -name 'recovery.img' -o -name 'OrangeFox*.zip' \) \
                  -exec cp -v {} "$ART_DIR"/ \; || true
              [ -f "$ART_DIR/recovery.img" ] || ls "$ART_DIR"/OrangeFox*.zip >/dev/null 2>&1
          }

          s08_package() {
              cd "$ART_DIR" || return 1
              rm -rf _pkg
              local ofox_zip
              ofox_zip=$(ls -1 OrangeFox*.zip 2>/dev/null | grep -vxF "$ZIP_NAME" | head -n1 || true)
              if [ -n "$ofox_zip" ] && [ -f "$ofox_zip" ]; then
                  cp -f "$ofox_zip" "$ZIP_NAME"; return 0
              fi
              [ -f recovery.img ] || return 1
              mkdir -p _pkg/META-INF/com/google/android
              cp recovery.img _pkg/recovery.img
              cat > _pkg/META-INF/com/google/android/update-binary <<'EOS'
          #!/sbin/sh
          OUTFD=$2; ZIPFILE=$3
          ui_print() { echo "ui_print $1" >&$OUTFD; echo "ui_print" >&$OUTFD; }
          ui_print "OrangeFox installer (hero2lte)"
          rm -rf /tmp/of_pkg; mkdir -p /tmp/of_pkg; cd /tmp/of_pkg || exit 1
          unzip -o "$ZIPFILE" recovery.img || exit 1
          BLK="/dev/block/by-name/RECOVERY"
          [ -e "$BLK" ] || BLK=$(find /dev/block/platform -type l -name RECOVERY 2>/dev/null | head -n1)
          [ -n "$BLK" ] && [ -e "$BLK" ] || { ui_print "RECOVERY not found"; exit 1; }
          dd if=recovery.img of="$BLK" bs=4M || exit 1
          sync
          ui_print "Flash complete"
          EOS
              chmod +x _pkg/META-INF/com/google/android/update-binary
              printf 'ui_print("OrangeFox recovery flash");\n' > _pkg/META-INF/com/google/android/updater-script
              rm -f "$ZIP_NAME"
              ( cd _pkg && zip -r "../$ZIP_NAME" . >/dev/null )
              local rc=$?; rm -rf _pkg; return $rc
          }

          retry_step "00_env"        s00_env
          retry_step "01_ccache"     s01_ccache
          retry_step "02_repo_tool"  s02_repo_tool
          retry_step "03_sync_fox"   s03_sync_fox
          retry_step "04_clone_dt"   s04_clone_dt
          retry_step "05_clone_deps" s05_clone_deps
          retry_step "06_build"      s06_build
          retry_step "07_collect"    s07_collect
          retry_step "08_package"    s08_package

          log "════════ SUMMARY ════════"
          if [ "${#FAILED[@]}" -eq 0 ]; then log "All steps OK"
          else for s in "${FAILED[@]}"; do log "  - $s"; done; fi
          if [ -f "$ART_DIR/$ZIP_NAME" ]; then
              log "ARTIFACT OK: $ART_DIR/$ZIP_NAME"
              touch "$SENTINEL"
          else
              log "NO ARTIFACT produced"
          fi
          BUILDEOF

          chmod +x "$WORKDIR/of_build.sh"
          bash -n "$WORKDIR/of_build.sh" || { echo "SYNTAX ERROR build script"; exit 1; }
          echo "Bootstrap done."

      - name: AI-everywhere build loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          START=$(date +%s)
          ATTEMPT=0
          ZERO_CCACHE_HITS=0

          # AI system prompt (heredoc, đúng indent)
          cat > /tmp/ai_system_raw.txt <<'SYSEOF'
          You are an autonomous Android OrangeFox/TWRP build fixer for Samsung hero2lte (Galaxy S7 edge).
          Your output is a BASH SCRIPT that will be executed INSIDE ubuntu:22.04 as root,
          with /workspace/foxbuild mounted at /workspace/foxbuild (same as host WORKDIR).

          You can fix ANYTHING by editing files under /workspace/foxbuild/:
          - /workspace/foxbuild/Dockerfile         (base image, packages, build deps)
          - /workspace/foxbuild/of_build.sh        (build orchestration)
          - /workspace/foxbuild/ai/ai_fix.sh       (not needed here, you ARE writing the next fix)

          Current context:
          - Default Dockerfile uses ubuntu:22.04 (fully supported, no 404).
          - Default build script tries device tree branches in order:
            fox_11.0, fox_9.0, main. All from https://github.com/OrangeFoxRecovery/device_samsung_hero2lte.git
          - Repo sync uses https://gitlab.com/OrangeFox/Manifest.git branch fox_11.0, fallback orangefox_sync.sh.

          Rules for your output:
          - Output ONLY bash script. No markdown. No explanation.
          - Whitelisted/blacklisted: NEVER use eval, sh -c, bash -c, base64 -d, sudo, mount, umount, dd.
          - Never pipe curl/wget into sh/bash.
          - Never write outside /workspace/foxbuild/ or /tmp/.
          - Prefer minimal edits (sed -i, echo >>, cat > ... <<EOF).
          - If you cannot determine a safe fix, output exactly: # NO FIX

          Common strategies you SHOULD apply when relevant:
          - apt 404 on package: append `apt-get update` then retry, or change base image in Dockerfile to debian:12 / ubuntu:24.04.
          - git/repo missing: add to Dockerfile apt list.
          - repo init/sync failure: try alternate manifest URLs (github.com/OrangeFoxRecovery/platform_manifest) or emit `# NO FIX` so human sees.
          - Missing device dependencies: ADD git clone lines to s05_clone_deps in of_build.sh.
            Known useful repos for hero2lte (fill DEP_* env vars or inline clone):
              * https://github.com/LineageOS/android_device_samsung_hero-common (branch lineage-18.1)
              * https://github.com/LineageOS/android_kernel_samsung_universal8890 (branch lineage-18.1)
              * https://github.com/LineageOS/android_hardware_samsung (branch lineage-18.1)
          - lunch target unknown: append `grep -r 'add_lunch_combo' device/samsung/hero2lte/` to log and try both fox_hero2lte-eng and omni_hero2lte-eng.
          - Out of disk / OOM: in of_build.sh, `apt-get clean; rm -rf /tmp/*; ccache -C` before mka; add `export LC_ALL=C` and lower `-j` if needed.
          - Sync succeeded but build/envsetup.sh missing: repo sync did not finish — append `repo sync -j1 --force-sync` to s03.

          Output example (do NOT copy verbatim, adapt to actual failure):
