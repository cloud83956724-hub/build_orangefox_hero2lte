name: Build OrangeFox hero2lte (A-Z single file v3)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      WORKDIR: ${{ github.workspace }}/foxbuild
      FOX_BRANCH: "11.0"
      JOBS: "4"
      CCACHE_MAX: "20G"
      ZIP_NAME: "OrangeFox-hero2lte-TWRP.zip"
      DEVICE_TREE_URL: "https://github.com/OrangeFoxRecovery/device_samsung_hero2lte.git"
      DEVICE_TREE_BRANCH: "fox_11.0"
      # Điền khi build báo thiếu dependency (xem log bước 06_build)
      DEP_HERO_COMMON_URL: ""
      DEP_HERO_COMMON_BRANCH: "fox_11.0"
      DEP_UNIVERSAL8890_URL: ""
      DEP_UNIVERSAL8890_BRANCH: "fox_11.0"
      DEP_HW_SAMSUNG_URL: ""
      DEP_HW_SAMSUNG_BRANCH: "fox_11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hero2lte-${{ github.sha }}
          restore-keys: |
            ccache-hero2lte-

      - name: Setup swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          free -h

      - name: Verify Ubuntu focal reachability (fast, trên host)
        run: |
          echo "=== old-releases.ubuntu.com/focal ==="
          curl -fsSL -o /dev/null -w "HTTP %{http_code}  time %{time_total}s\n" \
            http://old-releases.ubuntu.com/ubuntu/dists/focal/Release \
            || echo "old-releases FAILED"
          echo
          echo "=== archive.ubuntu.com/focal (thường 404 vì focal EOL) ==="
          curl -fsSL -o /dev/null -w "HTTP %{http_code}  time %{time_total}s\n" \
            http://archive.ubuntu.com/ubuntu/dists/focal/Release \
            || echo "archive FAILED (dự kiến)"

      - name: Build builder image (apt cài riêng, fail-fast, rõ lỗi)
        run: |
          cat > /tmp/Dockerfile <<'DOCKEREOF'
          FROM ubuntu:20.04
          ENV DEBIAN_FRONTEND=noninteractive
          ENV LC_ALL=C

          # 1) In sources.list gốc để debug, backup
          RUN echo "=== ORIGINAL sources.list ===" \
           && cat /etc/apt/sources.list \
           && cp /etc/apt/sources.list /etc/apt/sources.list.orig

          # 2) Sed sang old-releases và VERIFY là đã áp dụng
          RUN sed -i \
                -e 's|http://archive.ubuntu.com|http://old-releases.ubuntu.com|g' \
                -e 's|http://security.ubuntu.com|http://old-releases.ubuntu.com|g' \
                /etc/apt/sources.list \
           && echo "=== NEW sources.list ===" \
           && cat /etc/apt/sources.list \
           && if grep -q old-releases /etc/apt/sources.list; then \
                echo "OK: old-releases applied"; \
              else \
                echo "ERROR: sed không áp dụng được - sources.list format lạ"; \
                exit 1; \
              fi

          # 3) apt update với retry; nếu old-releases fail thì thử revert về archive
          RUN ( apt-get update -y -o Acquire::Retries=5 -o Acquire::ForceIPv4=true \
                || ( echo ">>> old-releases update failed, fallback archive..." \
                     && cp /etc/apt/sources.list.orig /etc/apt/sources.list \
                     && apt-get update -y -o Acquire::Retries=5 -o Acquire::ForceIPv4=true ) \
              ) 2>&1 | tail -40

          # 4) Cài theo NHÓM NHỎ - 1 nhóm fail không giết cả list
          RUN set -x; \
              for grp in \
                  "ca-certificates" \
                  "git" \
                  "curl" \
                  "zip unzip" \
                  "build-essential make" \
                  "flex bison gperf" \
                  "python3" \
                  "python-is-python3" \
                  "ccache" \
                  "rsync procps file" \
                  "libssl-dev" \
                  "openjdk-11-jdk" \
                  "zlib1g-dev" \
                  "gcc-multilib g++-multilib libc6-dev-i386" \
                  "lib32ncurses5-dev lib32z1-dev" \
                  "lzop libxml2-utils xsltproc fontconfig" \
                  "libgl1-mesa-dev libx11-dev" \
                  "x11proto-core-dev" \
              ; do \
                  echo ">>> GROUP: $grp"; \
                  apt-get install -y --no-install-recommends \
                      -o Acquire::Retries=5 -o Acquire::ForceIPv4=true $grp 2>&1 | tail -5 \
                      || echo ">>> WARN: group install failed: $grp"; \
              done

          # 5) Fallback: nếu python-is-python3 không có, tự symlink
          RUN command -v python >/dev/null 2>&1 \
              || ln -sf /usr/bin/python3 /usr/local/bin/python; \
              python --version 2>&1 || true

          # 6) Verify critical tools — nếu thiếu thì FAIL image rõ ràng
          RUN set -e; \
              ok=1; \
              for t in git curl gcc g++ make ccache python3 zip unzip java; do \
                  if command -v "$t" >/dev/null 2>&1; then \
                      echo "OK:    $t -> $(command -v $t)"; \
                  else \
                      echo "MISSING: $t"; ok=0; \
                  fi; \
              done; \
              [ "$ok" = "1" ] || (echo "FATAL: critical tools missing" && exit 1); \
              echo 'int main(){return 0;}' | gcc -m32 -x c - -o /tmp/t32 \
                && echo "OK: 32-bit gcc works" \
                || echo "WARN: 32-bit gcc broken (có thể vẫn OK cho recovery)"

          WORKDIR /workspace
          DOCKEREOF

          cat /tmp/Dockerfile
          echo "==============================================================="
          echo "docker build output (apt errors sẽ hiện rõ ở đây):"
          echo "==============================================================="
          docker build --progress=plain -t foxbuilder:hero2lte /tmp/

      - name: Build A-Z in container
        run: |
          set +e
          mkdir -p "$WORKDIR/artifacts"
          rm -f "$WORKDIR/.build_done"

          cat > /tmp/of_build.sh <<'BUILDEOF'
          #!/bin/bash
          set +e
          export LC_ALL=C

          DEVICE="hero2lte"
          FOX_PATH="$WORKDIR/$FOX_BRANCH"
          ART_DIR="$WORKDIR/artifacts"
          LOG="$WORKDIR/build.log"
          SENTINEL="$WORKDIR/.build_done"
          FAILED=()

          mkdir -p "$WORKDIR" "$ART_DIR" "/root/.ccache"
          : > "$LOG"

          log() { printf '[%s] %s\n' "$(date '+%H:%M:%S')" "$*" | tee -a "$LOG" >&2; }

          retry_step() {
            local name="$1"; shift
            log "================================================================"
            log "STEP START: $name"
            log "================================================================"
            "$@" 2>&1 | tee -a "$LOG" >&2
            local rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then log "[OK]   $name"; return 0; fi
            log "[RETRY] $name failed (rc=$rc) -> retry once in 10s"
            sleep 10
            "$@" 2>&1 | tee -a "$LOG" >&2
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then log "[OK]   $name (retry)"; return 0; fi
            log "[FAIL] $name failed after retry (rc=$rc) -> CONTINUE"
            FAILED+=("$name"); return 0
          }

          s00_env() {
            uname -a
            head -3 /etc/os-release
            nproc; free -h; df -h /
            for t in git curl wget gcc g++ make ccache python3 zip unzip java; do
              command -v "$t" || echo "MISSING: $t"
            done
          }

          s01_ccache() {
            export CCACHE_DIR="/root/.ccache"
            ccache -M "$CCACHE_MAX"
            ccache -z
            ccache -s
          }

          s02_repo_tool() {
            mkdir -p /root/.bin
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /root/.bin/repo
            chmod +x /root/.bin/repo
            export PATH="/root/.bin:$PATH"
            /root/.bin/repo --version
          }

          s03_sync_fox() {
            export PATH="/root/.bin:$PATH"
            if [ ! -d "$FOX_PATH/.repo" ]; then
              rm -rf "$WORKDIR/sync"
              git clone https://gitlab.com/OrangeFox/sync.git -b fox_11.0 --depth=1 "$WORKDIR/sync" || return 1
              ( cd "$WORKDIR/sync" && ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_PATH" )
            else
              ( cd "$FOX_PATH" && repo sync -j"$JOBS" --force-sync --no-clone-bundle --no-tags )
            fi
          }

          s04_clone_dt() {
            mkdir -p "$FOX_PATH/device/samsung"
            rm -rf "$FOX_PATH/device/samsung/$DEVICE"
            git clone --depth=1 -b "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" \
              "$FOX_PATH/device/samsung/$DEVICE"
          }

          s05_clone_deps() {
            cd "$FOX_PATH" || return 1
            local fail=0
            if [ -n "$DEP_HERO_COMMON_URL" ] && [ ! -d device/samsung/hero-common ]; then
              git clone --depth=1 -b "$DEP_HERO_COMMON_BRANCH" \
                "$DEP_HERO_COMMON_URL" device/samsung/hero-common || fail=1
            fi
            if [ -n "$DEP_UNIVERSAL8890_URL" ] && [ ! -d kernel/samsung/universal8890 ]; then
              mkdir -p kernel/samsung
              git clone --depth=1 -b "$DEP_UNIVERSAL8890_BRANCH" \
                "$DEP_UNIVERSAL8890_URL" kernel/samsung/universal8890 || fail=1
            fi
            if [ -n "$DEP_HW_SAMSUNG_URL" ] && [ ! -d hardware/samsung ]; then
              mkdir -p hardware
              git clone --depth=1 -b "$DEP_HW_SAMSUNG_BRANCH" \
                "$DEP_HW_SAMSUNG_URL" hardware/samsung || fail=1
            fi
            return $fail
          }

          s06_build() {
            cd "$FOX_PATH" || return 1
            export ALLOW_MISSING_DEPENDENCIES=true
            export USE_CCACHE=1
            export CCACHE_DIR="/root/.ccache"
            export CCACHE_COMPRESS=1
            export CCACHE_MAXSIZE="$CCACHE_MAX"
            source build/envsetup.sh || return 1
            if ! lunch omni_${DEVICE}-eng; then
              lunch fox_${DEVICE}-eng || return 1
            fi
            mka recoveryimage -j"$JOBS"
          }

          s07_collect() {
            local out="$FOX_PATH/out/target/product/$DEVICE"
            [ -d "$out" ] || { echo "out missing: $out"; return 1; }
            find "$out" -maxdepth 1 -type f \
              \( -name 'recovery.img' -o -name 'OrangeFox*.zip' \) \
              -exec cp -v {} "$ART_DIR"/ \; || true
            ls -la "$ART_DIR"
            [ -f "$ART_DIR/recovery.img" ] || ls "$ART_DIR"/OrangeFox*.zip >/dev/null 2>&1
          }

          s08_package() {
            cd "$ART_DIR" || return 1
            rm -rf _pkg
            local ofox_zip
            ofox_zip=$(ls -1 OrangeFox*.zip 2>/dev/null | grep -vxF "$ZIP_NAME" | head -n1 || true)
            if [ -n "$ofox_zip" ] && [ -f "$ofox_zip" ]; then
              cp -f "$ofox_zip" "$ZIP_NAME"; return 0
            fi
            [ -f recovery.img ] || { echo "no recovery.img and no OrangeFox zip"; return 1; }
            mkdir -p _pkg/META-INF/com/google/android
            cp recovery.img _pkg/recovery.img
            cat > _pkg/META-INF/com/google/android/update-binary <<'EOS'
          #!/sbin/sh
          OUTFD=$2
          ZIPFILE=$3
          ui_print() { echo "ui_print $1" >&$OUTFD; echo "ui_print" >&$OUTFD; }
          ui_print "OrangeFox installer (hero2lte)"
          rm -rf /tmp/of_pkg; mkdir -p /tmp/of_pkg; cd /tmp/of_pkg || exit 1
          unzip -o "$ZIPFILE" recovery.img || exit 1
          BLK="/dev/block/by-name/RECOVERY"
          [ -e "$BLK" ] || BLK=$(find /dev/block/platform -type l -name RECOVERY 2>/dev/null | head -n1)
          [ -n "$BLK" ] && [ -e "$BLK" ] || { ui_print "RECOVERY partition not found"; exit 1; }
          ui_print "Flashing to $BLK"
          dd if=recovery.img of="$BLK" bs=4M || exit 1
          sync
          ui_print "Flash complete"
          EOS
            chmod +x _pkg/META-INF/com/google/android/update-binary
            printf 'ui_print("OrangeFox recovery flash");\n' > _pkg/META-INF/com/google/android/updater-script
            rm -f "$ZIP_NAME"
            ( cd _pkg && zip -r "../$ZIP_NAME" . >/dev/null )
            local rc=$?
            rm -rf _pkg
            return $rc
          }

          retry_step "00_env"         s00_env
          retry_step "01_ccache"      s01_ccache
          retry_step "02_repo_tool"   s02_repo_tool
          retry_step "03_sync_fox"    s03_sync_fox
          retry_step "04_clone_dt"    s04_clone_dt
          retry_step "05_clone_deps"  s05_clone_deps
          retry_step "06_build"       s06_build
          retry_step "07_collect"     s07_collect
          retry_step "08_package"     s08_package

          log "================================================================"
          log "SUMMARY"
          log "================================================================"
          if [ "${#FAILED[@]}" -eq 0 ]; then
            log "All steps OK"
          else
            log "Failed steps (đã đi tiếp):"
            for s in "${FAILED[@]}"; do log "  - $s"; done
          fi

          if [ -f "$ART_DIR/$ZIP_NAME" ]; then
            log "ARTIFACT OK: $ART_DIR/$ZIP_NAME"
            ls -lh "$ART_DIR/$ZIP_NAME"
            touch "$SENTINEL"
          else
            log "NO ARTIFACT produced"
          fi
          log "=== CONTAINER SCRIPT END ==="
          BUILDEOF

          chmod +x /tmp/of_build.sh
          bash -n /tmp/of_build.sh && echo "syntax OK"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/.ccache:/root/.ccache" \
            -v "/tmp/of_build.sh:/of_build.sh:ro" \
            -w /workspace \
            -e WORKDIR="/workspace/foxbuild" \
            -e FOX_BRANCH="$FOX_BRANCH" \
            -e JOBS="$JOBS" \
            -e CCACHE_MAX="$CCACHE_MAX" \
            -e ZIP_NAME="$ZIP_NAME" \
            -e DEVICE_TREE_URL="$DEVICE_TREE_URL" \
            -e DEVICE_TREE_BRANCH="$DEVICE_TREE_BRANCH" \
            -e DEP_HERO_COMMON_URL="$DEP_HERO_COMMON_URL" \
            -e DEP_HERO_COMMON_BRANCH="$DEP_HERO_COMMON_BRANCH" \
            -e DEP_UNIVERSAL8890_URL="$DEP_UNIVERSAL8890_URL" \
            -e DEP_UNIVERSAL8890_BRANCH="$DEP_UNIVERSAL8890_BRANCH" \
            -e DEP_HW_SAMSUNG_URL="$DEP_HW_SAMSUNG_URL" \
            -e DEP_HW_SAMSUNG_BRANCH="$DEP_HW_SAMSUNG_BRANCH" \
            foxbuilder:hero2lte bash /of_build.sh
          echo "=== docker exit=$? ==="

          echo "=== SENTINEL ==="
          if [ -f "$WORKDIR/.build_done" ]; then
            echo "OK: container chạy hết script và có artifact."
          else
            echo "WARN: container thoát sớm hoặc không có artifact."
          fi

          echo "=== FULL build.log (in ra UI) ==="
          if [ -f "$WORKDIR/build.log" ]; then
            wc -l "$WORKDIR/build.log"
            cat "$WORKDIR/build.log"
          else
            echo "No build.log"
          fi

          echo "=== artifacts ==="
          ls -la "$WORKDIR/artifacts" || true

      - name: Upload zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-hero2lte-TWRP
          path: ${{ env.WORKDIR }}/artifacts/*.zip
          if-no-files-found: warn

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.WORKDIR }}/build.log
          if-no-files-found: warn
