name: Build OrangeFox hero2lte

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: "1: Setup swap"
        run: |
          set -x
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /
          mkdir -p "${{ github.workspace }}/fox" "${{ github.workspace }}/out"

      - name: "2: Check what's pre-installed"
        run: |
          set -x
          for t in git curl wget python3 gcc g++ make file zip unzip tar xxd java ccache flex bison gperf rsync lzop xsltproc; do
            command -v "$t" && "$t" --version 2>&1 | head -1 || echo "MISSING: $t"
          done
          echo "--- Java homes ---"
          ls /usr/lib/jvm/ 2>/dev/null || true
          echo "JAVA_HOME_11_X64=$JAVA_HOME_11_X64"

      - name: "3: apt update (timeout 4 min)"
        timeout-minutes: 5
        run: |
          set -x
          sudo rm -rf /var/lib/apt/lists/*
          sudo timeout 240 apt-get update \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::Retries=2 \
            -o Acquire::ForceIPv4=true
          echo "update rc=$?"

      - name: "4: apt install (only MISSING packages, timeout 15 min)"
        timeout-minutes: 20
        run: |
          set -x
          # Chỉ cài những gì runner Ubuntu latest thường thiếu cho AOSP recovery
          sudo DEBIAN_FRONTEND=noninteractive timeout 900 apt-get install -y --no-install-recommends \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::Retries=2 \
            ccache flex bison gperf \
            libssl-dev zlib1g-dev lzop libxml2-utils xsltproc \
            python-is-python3 \
            libc6-dev-i386 lib32ncurses-dev lib32readline-dev lib32z1-dev \
            || echo "INSTALL PARTIAL (continuing anyway)"
          echo "install rc=$?"
          echo "--- verify ---"
          for t in ccache flex bison gperf xsltproc python3; do
            command -v "$t" || echo "MISSING $t"
          done

      - name: "5: Install repo tool"
        run: |
          set -x
          mkdir -p "$HOME/.bin"
          curl -fsSL --max-time 60 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.bin/repo"
          chmod +x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          "$HOME/.bin/repo" --version

      - name: "6: Repo init + sync"
        working-directory: ${{ github.workspace }}/fox
        run: |
          set -x
          export PATH="$HOME/.bin:$PATH"
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_11.0
          echo "--- manifest list ---"
          ls -la .repo/manifests/ 2>/dev/null || true
          echo "--- syncing (this takes 30-60 min) ---"
          repo sync -j4 --no-clone-bundle --no-tags
          ls -la

      - name: "7: Clone device tree + deps"
        working-directory: ${{ github.workspace }}/fox
        run: |
          set -x
          mkdir -p device/samsung kernel/samsung hardware

          DT_OK=0
          for b in fox_11.0 fox_9.0 main; do
            echo "=== try device tree branch: $b ==="
            rm -rf device/samsung/hero2lte
            if git clone --depth=1 -b "$b" \
                https://github.com/OrangeFoxRecovery/device_samsung_hero2lte.git \
                device/samsung/hero2lte; then
              echo "=== OK branch=$b ==="
              DT_OK=1; break
            fi
          done
          [ "$DT_OK" = "1" ] || { echo "!!! ALL DT BRANCHES FAILED"; exit 1; }

          git clone --depth=1 -b lineage-18.1 \
            https://github.com/LineageOS/android_device_samsung_hero-common.git \
            device/samsung/hero-common || echo "hero-common skip"
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_samsung_universal8890.git \
            kernel/samsung/universal8890 || echo "kernel skip"
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/LineageOS/android_hardware_samsung.git \
            hardware/samsung || echo "hardware skip"

      - name: "8: Build recovery"
        working-directory: ${{ github.workspace }}/fox
        run: |
          set -x
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=20G
          mkdir -p "$CCACHE_DIR"
          ccache -M 20G; ccache -z
          # Chọn Java 11 (AOSP 11 cần Java 11)
          if [ -d "$JAVA_HOME_11_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_11_X64"
          elif [ -d /usr/lib/jvm/java-11-openjdk-amd64 ]; then
            export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          source build/envsetup.sh
          lunch omni_hero2lte-eng \
            || lunch fox_hero2lte-eng \
            || lunch lineage_hero2lte-eng \
            || { echo "NO LUNCH TARGET"; exit 1; }
          mka recoveryimage -j4

      - name: "9: Verify + package + upload"
        if: always()
        run: |
          set -x
          WD="${{ github.workspace }}"
          OUT="$WD/fox/out/target/product/hero2lte"
          DEST="$WD/out"
          mkdir -p "$DEST"
          if [ -d "$OUT" ]; then
            ls -la "$OUT"
            cp -v "$OUT/recovery.img" "$DEST/" 2>/dev/null || true
            cp -v "$OUT"/OrangeFox*.zip "$DEST/" 2>/dev/null || true
          else
            echo "!!! OUT DIR MISSING: $OUT"
          fi
          cd "$DEST"
          if [ -f recovery.img ] && [ ! -f OrangeFox-hero2lte-TWRP.zip ]; then
            mkdir -p _pkg/META-INF/com/google/android
            cp recovery.img _pkg/
            printf '%s\n' \
              '#!/sbin/sh' \
              'OUTFD=$2' \
              'ZIPFILE=$3' \
              'ui_print() { echo "ui_print $1" >&$OUTFD; echo "ui_print" >&$OUTFD; }' \
              'ui_print "OrangeFox hero2lte"' \
              'rm -rf /tmp/op && mkdir -p /tmp/op && cd /tmp/op' \
              'unzip -o "$ZIPFILE" recovery.img || exit 1' \
              'BLK="/dev/block/by-name/RECOVERY"' \
              '[ -e "$BLK" ] || BLK=$(find /dev/block/platform -type l -name RECOVERY 2>/dev/null | head -n1)' \
              '[ -n "$BLK" ] && [ -e "$BLK" ] || { ui_print "RECOVERY not found"; exit 1; }' \
              'dd if=recovery.img of="$BLK" bs=4M || exit 1' \
              'sync' \
              'ui_print "Done"' \
              > _pkg/META-INF/com/google/android/update-binary
            chmod +x _pkg/META-INF/com/google/android/update-binary
            printf 'ui_print("OrangeFox");\n' > _pkg/META-INF/com/google/android/updater-script
            ( cd _pkg && zip -r ../OrangeFox-hero2lte-TWRP.zip . )
            rm -rf _pkg
          fi
          ls -la "$DEST"

      - name: "10: Upload artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-hero2lte-output
          path: ${{ github.workspace }}/out/
          if-no-files-found: warn
